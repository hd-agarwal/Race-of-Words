services:
  broker:
    image: apache/kafka:4.3.1
    hostname: broker
    ports:
      - ${PORT_KAFKA_BROKER}:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
#      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      retries: 5
      timeout: 10s
  
  topic-initializer:
    image: confluentinc/cp-kafka:8.2.2
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: >
      sh -c '
        echo "Creating Kafka topic..."
        kafka-topics --create \
          --bootstrap-server broker:29092 \
          --topic ${KAFKA_TOPIC} \
          --partitions 1 \
          --replication-factor 1 \
          --config cleanup.policy=delete \
          --config retention.ms=1800000 \
          --if-not-exists
      '

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.2
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "${PORT_SCHEMA_REGISTRY}:${PORT_SCHEMA_REGISTRY_INTERNAL}"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:${PORT_SCHEMA_REGISTRY_INTERNAL}'
    healthcheck:
      test: ["CMD", "curl", "--output", "/dev/null", "--silent", "--head", "--fail", "http://schema-registry:${PORT_SCHEMA_REGISTRY_INTERNAL}/subjects"]
      interval: 20s
      timeout: 10s
      retries: 10

  schema-initializer:
    image: curlimages/curl:8.21.0
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ../dataset-generation/resources:/schemas
    entrypoint: >
      sh -c '
        echo "Waiting for Schema Registry..." &&
        until curl -s http://schema-registry:${PORT_SCHEMA_REGISTRY_INTERNAL}/subjects; do
          sleep 2;
        done &&
        
        echo "=== AVSC file ===" &&
        cat /schemas/dataset_message.avsc &&
        echo "" &&
        
        ESCAPED_SCHEMA=$$(awk "{print}" ORS="" /schemas/dataset_message.avsc | tr -d "\n\t" | sed "s/\"/\\\\\"/g") &&
        
        echo "=== final JSON payload ===" &&
        PAYLOAD="{\"schema\":\"$$ESCAPED_SCHEMA\"}" &&
        echo "$$PAYLOAD" &&
        echo "" &&

        echo "=== Registering schema via REST API ===" &&
        curl -X POST \
          -H "Content-Type: application/vnd.schemaregistry.v1+json" \
          -d "$$PAYLOAD" \
          http://schema-registry:${PORT_SCHEMA_REGISTRY_INTERNAL}/subjects/${KAFKA_TOPIC}-value/versions
        echo ""
      '

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "${PORT_KAFKA_UI}:${PORT_KAFKA_UI_INTERNAL}"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:${PORT_SCHEMA_REGISTRY_INTERNAL}

volumes:
  kafka_data:
